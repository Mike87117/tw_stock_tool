name: Python Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install lint dependencies
        run: python -m pip install "ruff>=0.16,<0.17"

      # tests/ is not gated yet: it still carries ~138 findings, several of which
      # are deliberate import-as-availability-assertion patterns that need
      # per-file review before they can be cleaned or exempted.
      - name: Check for dead imports, dead locals and undefined names
        run: ruff check src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ github.event_name == 'push' && fromJSON('["3.11", "3.12"]') || fromJSON('["3.12"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unittest
        run: python -m unittest discover -s tests

  package-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package from repository metadata
        run: python -m pip install .

      - name: Smoke installed package and console entrypoint
        run: |
          python -c "import tomllib; from importlib.metadata import version; expected = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; actual = version('tw-stock-tool'); assert actual == expected, f'installed={actual} expected={expected}'; print(actual)"
          python -c "import tw_stock_tool"
          python -c "from tw_stock_tool.cli import twstock_cli"
          python -m tw_stock_tool.cli.twstock_cli --help
          twstock --help
          twstock run --help
          twstock run list --help
          twstock run inspect --help
          twstock doctor --help
          twstock analyze --help
          twstock daily --help
          twstock backtest-report --help
          twstock parameter-sweep --help
          twstock walk-forward --help
          twstock daily-report-artifact --help
          twstock backtest-artifact --help
          twstock backtest-result-export --help
          twstock simulated-paper-trading --help
          twstock simulated-paper-trading-export --help
          twstock simulated-portfolio-artifact --help
          twstock simulated-portfolio-trading --help
