name: Python Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install lint dependencies
        run: python -m pip install "ruff>=0.16,<0.17"

      # tests/ is not gated yet: it still carries ~138 findings, several of which
      # are deliberate import-as-availability-assertion patterns that need
      # per-file review before they can be cleaned or exempted.
      - name: Check for dead imports, dead locals and undefined names
        run: ruff check src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unittest
        run: python -m unittest discover -s tests --durations 30

  python-311-compatibility:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unittest
        run: python -m unittest discover -s tests

  package-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package from repository metadata
        run: python -m pip install .

      # Runs from a temporary directory with the checkout stripped from the
      # import path, so the repository-root compatibility shim cannot stand in
      # for the installed distribution. Also asserts a command-specific marker
      # in every `twstock <command> --help`, which exit status alone cannot do.
      - name: Smoke installed package outside the repository tree
        run: python scripts/package_smoke.py --repository-root .

      # Outside the checkout, so doctor must not depend on repository-only
      # files being present (Issue #84 B1).
      - name: Verify twstock doctor passes against the installed distribution
        working-directory: ${{ runner.temp }}
        run: twstock doctor
